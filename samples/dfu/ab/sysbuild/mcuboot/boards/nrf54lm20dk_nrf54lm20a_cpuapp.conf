# Enable RRAM driver for nRF54LM20A
#CONFIG_SOC_FLASH_NRF_RRAM=y

# MCUboot configuration
#CONFIG_SINGLE_APPLICATION_SLOT=n
#CONFIG_BOOT_SWAP_USING_MOVE=y
#CONFIG_BOOT_DIRECT_XIP=y

# Enable serial recovery
#CONFIG_MCUBOOT_SERIAL=y
#CONFIG_UART_CONSOLE=n


# The default MCUboot is too large to support fprotect.
# To use fprotect disable logs or perform other size optimizations.
# For example, do:
# CONFIG_PM_PARTITION_SIZE_MCUBOOT=0xE800
# CONFIG_LOG=n
# CONFIG_FPROTECT=y
CONFIG_FPROTECT=n

# Enable retained memory for boot request
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y

# Flash size - full 2036KB available for CPUAPP (FLPR memory released via overlay)
CONFIG_FLASH_SIZE=2036
